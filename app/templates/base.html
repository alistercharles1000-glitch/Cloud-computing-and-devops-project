<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Image Vault{% endblock %}</title>
    <style>
      :root {
        --bg: #faf9f7;
        --ink: #1f1d1a;
        --muted: #75716a;
        --line: #e4e1da;
        --accent: #14d866;
        --accent-ink: #ffffff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial,
          sans-serif;
        line-height: 1.5;
      }
      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 48px 24px 80px;
      }
      header.site {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        border-bottom: 1px solid var(--line);
        padding-bottom: 20px;
        margin-bottom: 36px;
      }
      header.site .brand {
        font-size: 14px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      header.site nav a {
        color: var(--ink);
        text-decoration: none;
        font-size: 14px;
        border-bottom: 1px solid transparent;
      }
      header.site nav a:hover,
      header.site nav a:focus-visible {
        border-bottom-color: var(--accent);
      }
      h1 {
        font-size: 28px;
        margin: 0 0 8px;
        letter-spacing: -0.01em;
      }
      p.lede {
        color: var(--muted);
        margin: 0 0 32px;
      }
      .flash {
        background: #fff3ec;
        border: 1px solid #e8c3ab;
        color: #7a3a1c;
        padding: 12px 16px;
        border-radius: 6px;
        margin-bottom: 24px;
        font-size: 14px;
      }
      a.button,
      button.button {
        display: inline-block;
        background: var(--accent);
        color: var(--accent-ink);
        border: none;
        padding: 10px 18px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      a.button:hover,
      button.button:hover {
        background: #9a4825;
      }
      a.button:focus-visible,
      button.button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="site">
        <span class="brand">Image Vault</span>
        <nav>
          <a href="{{ url_for('index') }}">Files</a>
          &nbsp;&middot;&nbsp;
          <a href="{{ url_for('upload') }}">Upload</a>
        </nav>
      </header>

      {% with messages = get_flashed_messages() %} {% if messages %} {% for
      message in messages %}
      <div class="flash">{{ message }}</div>
      {% endfor %} {% endif %} {% endwith %} {% block content %}{% endblock %}
    </div>
  </body>
</html>
